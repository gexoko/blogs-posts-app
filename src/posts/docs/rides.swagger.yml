tags:
  - name: Rides
    description: API for managing rides (JSON:API format)

paths:
  /api/rides:
    get:
      summary: Get a list of all rides
      tags: [Rides]
      security:
        - BasicAuth: []
      responses:
        200:
          description: List of all rides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideListOutput'
    post:
      summary: Create a new ride
      tags: [Rides]
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideCreateInput'
      responses:
        201:
          description: Ride successfully created for an existing driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideOutput'
        400:
          description: Validation error or the driver does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/rides/{id}:
    get:
      summary: Get a ride by ID
      tags: [Rides]
      security:
        - BasicAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: The unique identifier of the ride
          schema:
            type: string
            example: '5'
      responses:
        200:
          description: The requested ride
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideOutput'
        404:
          description: Ride not found

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
  schemas:
    # Атрибуты поездки во входном запросе на создание.
    RideAttributes:
      type: object
      required:
        - clientName
        - price
        - currency
        - driverId
        - fromAddress
        - toAddress
      properties:
        clientName:
          type: string
          example: 'Alice Johnson'
        price:
          type: number
          format: float
          example: 15.75
        currency:
          type: string
          enum: [usd, eur]
          example: 'usd'
        driverId:
          type: integer
          example: 2
        fromAddress:
          type: string
          example: '123 Main St, Cityville'
        toAddress:
          type: string
          example: '456 Elm St, Townsville'
    # Атрибуты поездки в ответе (служебные даты наружу не отдаются).
    RideResourceAttributes:
      type: object
      properties:
        clientName:
          type: string
          example: 'Alice Johnson'
        driverId:
          type: integer
          example: 2
        driverName:
          type: string
          example: 'Tom Rider'
        vehicleLicensePlate:
          type: string
          example: 'XYZ 1234'
        vehicleName:
          type: string
          example: 'Toyota Camry'
        price:
          type: number
          format: float
          example: 15.75
        currency:
          type: string
          enum: [usd, eur]
          example: 'usd'
        addresses:
          type: object
          properties:
            from:
              type: string
              example: '123 Main St, Cityville'
            to:
              type: string
              example: '456 Elm St, Townsville'
    # JSON:API-ресурс поездки в ответе.
    RideResource:
      type: object
      properties:
        type:
          type: string
          enum: [rides]
        id:
          type: string
          example: '5'
        attributes:
          $ref: '#/components/schemas/RideResourceAttributes'
    RideCreateInput:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum: [rides]
            attributes:
              $ref: '#/components/schemas/RideAttributes'
    RideOutput:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RideResource'
    RideListOutput:
      type: object
      properties:
        meta:
          type: object
        data:
          type: array
          items:
            $ref: '#/components/schemas/RideResource'
    ValidationError:
      type: object
      properties:
        field:
          type: string
          example: 'data.attributes.clientName'
        message:
          type: string
          example: 'Client name is required'
    ValidationErrorResponse:
      type: object
      properties:
        errorMessages:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
